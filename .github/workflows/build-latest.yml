name: Build latest commit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANKIGEN_POSTHOG_TOKEN: ${{ vars.ANKIGEN_POSTHOG_TOKEN }}
  ANKIGEN_POSTHOG_REGION: ${{ vars.ANKIGEN_POSTHOG_REGION || 'eu' }}

concurrency:
  group: build-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rebuild le package pour la version courante
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Lire la version courante (tauri.conf.json)
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          "version=$($conf.version)" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $($conf.version)"

      - name: Installer les dépendances Python
        # Le lien public des releases de llama-cpp-python renvoie 504 (l'API, elle, sert le fichier) :
        # on prend la roue via `gh`, et pip la trouve déjà installée.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^llama_cpp_python==//p' requirements.txt)
          gh release download "v$v" --repo abetlen/llama-cpp-python --dir wheels             --pattern "llama_cpp_python-$v-py3-none-win_amd64.whl"
          python -m pip install --no-deps wheels/*.whl
          python -m pip install -r requirements.txt

      # Modèle local mis de côté (local_llm.ENABLED) : plus de llama.cpp Vulkan,
      # l'exe garde la roue processeur de requirements.txt (retirer la roue
      # changerait le runtime et forcerait une réinstallation). Pour le rallumer :
      # - uses: actions/cache@v4
      #   with:
      #     path: build/llama-vulkan
      #     key: llama-vulkan-${{ hashFiles('requirements.txt', 'scripts/build_llama_vulkan.ps1') }}
      # - name: Compiler llama.cpp avec Vulkan
      #   shell: pwsh
      #   run: scripts/build_llama_vulkan.ps1

      - name: Vérifier le contrat de runtime (runtime.json couvre requirements.txt)
        run: python scripts/runtime_contract.py --check

      - name: Compiler le sidecar Flask (PyInstaller)
        run: pyinstaller --noconfirm flask-server.spec

      # L'exe neuf fait tourner le code qu'il embarque : imports + sondes
      # (runtime_probe.py). Un module ou un encodeur manquant échoue ici, pas chez
      # l'utilisateur.
      - name: Auto-vérifier le sidecar
        run: dist/flask-server.exe --self-check

      - name: Placer le sidecar sous sa cible de compilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item dist/flask-server.exe src-tauri/binaries/flask-server-x86_64-pc-windows-msvc.exe -Force

      - name: Installer les dépendances Node
        run: npm ci

      - name: Compiler l'application Tauri
        run: npm run build

      # Même calcul que flask-server.spec : les modules viennent des imports
      # réels, rien n'est listé ici. version.json (version, commit,
      # requires_runtime, modules) est aussi publié comme asset séparé : l'updater
      # le lit sans télécharger app.zip, ce qui permet à un rebuild de main (même
      # version, nouveau commit) d'être détecté. analytics_config.json est généré
      # dans le payload à partir de ANKIGEN_POSTHOG_* (env du workflow).
      - name: Créer app.zip
        run: >
          python scripts/build_app_payload.py --dest release/app --zip app.zip
          --version ${{ steps.version.outputs.version }} --commit ${{ github.sha }}

      # Le cas que crée l'updater : ce nouveau code sur l'exe que les
      # utilisateurs ont déjà (celui de la release publiée).
      - name: Vérifier la compatibilité avec l'exe publié
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_runtime_compat.py --app-dir release/app

      - name: "Publier / mettre à jour la release v${{ steps.version.outputs.version }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            app.zip
            release/app/version.json
            dist/flask-server.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
