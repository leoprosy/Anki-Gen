name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ANKIGEN_POSTHOG_TOKEN: ${{ vars.ANKIGEN_POSTHOG_TOKEN }}
  ANKIGEN_POSTHOG_REGION: ${{ vars.ANKIGEN_POSTHOG_REGION || 'eu' }}

jobs:
  # ── 1. app.zip : ce que l'updater intégré télécharge ────────────────────────
  bundle:
    name: app.zip (updater payload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Même calcul que flask-server.spec : les modules viennent des imports
      # réels, rien n'est listé ici. version.json (version, commit,
      # requires_runtime, modules) est publié à la fois DANS app.zip et comme
      # asset séparé : l'updater le lit sans télécharger app.zip juste pour
      # vérifier (voir updater.fetch_remote_manifest). analytics_config.json est
      # généré dans le payload à partir de ANKIGEN_POSTHOG_* (env du workflow).
      - name: Créer app.zip
        run: >
          python scripts/build_app_payload.py --dest release/app --zip app.zip
          --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"

      - name: Créer le GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app.zip
            release/app/version.json
          generate_release_notes: true

  # ── 2. Installeurs Windows : ce que téléchargent les utilisateurs ───────────
  windows-installer:
    name: Windows installer (.exe / .msi)
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances Python
        # Le lien public des releases de llama-cpp-python renvoie 504 (l'API, elle, sert le fichier) :
        # on prend la roue via `gh`, et pip la trouve déjà installée.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^llama_cpp_python==//p' requirements.txt)
          gh release download "v$v" --repo abetlen/llama-cpp-python --dir wheels             --pattern "llama_cpp_python-$v-py3-none-win_amd64.whl"
          python -m pip install --no-deps wheels/*.whl
          python -m pip install -r requirements.txt

      # Modèle local mis de côté (local_llm.ENABLED) : plus de llama.cpp Vulkan,
      # l'exe garde la roue processeur de requirements.txt (retirer la roue
      # changerait le runtime et forcerait une réinstallation). Pour le rallumer :
      # - uses: actions/cache@v4
      #   with:
      #     path: build/llama-vulkan
      #     key: llama-vulkan-${{ hashFiles('requirements.txt', 'scripts/build_llama_vulkan.ps1') }}
      # - name: Compiler llama.cpp avec Vulkan
      #   shell: pwsh
      #   run: scripts/build_llama_vulkan.ps1

      # Le nom des installeurs vient de tauri.conf.json : sans cette étape, un
      # tag v1.3.0 produirait un Ankigen_1.2.0_x64-setup.exe.
      - name: Aligner la version sur le tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 30 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "[^"]*"', "version = `"$version`"" |
            Set-Content src-tauri/Cargo.toml -Encoding utf8
          Write-Host "Version : $version"

      - name: Vérifier le contrat de runtime (runtime.json couvre requirements.txt)
        run: python scripts/runtime_contract.py --check

      # flask-server.spec régénère version.json depuis tauri.conf.json.
      - name: Compiler le sidecar Flask (PyInstaller)
        run: pyinstaller --noconfirm flask-server.spec

      - name: Auto-vérifier le sidecar
        run: dist/flask-server.exe --self-check

      # Le cas que crée l'updater : le code de cette release sur l'exe que les
      # utilisateurs ont déjà. La release du tag courant est ignorée : elle
      # vient d'être créée et ne porte pas encore d'exe. La version du payload
      # vient de tauri.conf.json, déjà aligné sur le tag plus haut.
      - name: Vérifier la compatibilité avec l'exe publié
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_app_payload.py --dest release/app
          python scripts/check_runtime_compat.py --app-dir release/app --exclude-tag "${{ github.ref_name }}"

      - name: Placer le sidecar sous sa cible de compilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item dist/flask-server.exe src-tauri/binaries/flask-server-x86_64-pc-windows-msvc.exe -Force

      - name: Installer les dépendances Node
        run: npm ci

      - name: Compiler l'application Tauri
        run: npm run build

      - name: Attacher les installeurs au release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/flask-server.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
