name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ── 1. app.zip : ce que l'updater intégré télécharge ────────────────────────
  bundle:
    name: app.zip (updater payload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Créer app.zip (modules Python + templates + static + locales)
        run: |
          mkdir -p release/app

          # Copier les fichiers applicatifs
          cp app.py launcher.py parse_cours.py build_anki_csv.py \
             docx_blocks.py media_store.py render.py paths.py \
             project_store.py updater.py settings.py i18n.py release/app/
          cp -r templates static locales skill_templates release/app/

          # Générer version.json depuis le tag
          VERSION="${GITHUB_REF_NAME#v}"
          echo "{\"version\": \"${VERSION}\"}" > release/app/version.json

          # Créer l'archive
          cd release && zip -r ../app.zip app/

      - name: Créer le GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app.zip
          generate_release_notes: true

  # ── 2. Installeurs Windows : ce que téléchargent les utilisateurs ───────────
  windows-installer:
    name: Windows installer (.exe / .msi)
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances Python
        run: python -m pip install -r requirements.txt

      # Le nom des installeurs vient de tauri.conf.json : sans cette étape, un
      # tag v1.3.0 produirait un Ankigen_1.2.0_x64-setup.exe.
      - name: Aligner la version sur le tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 30 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "[^"]*"', "version = `"$version`"" |
            Set-Content src-tauri/Cargo.toml -Encoding utf8
          Write-Host "Version : $version"

      # flask-server.spec régénère version.json depuis tauri.conf.json.
      - name: Compiler le sidecar Flask (PyInstaller)
        run: pyinstaller --noconfirm flask-server.spec

      - name: Placer le sidecar sous sa cible de compilation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item dist/flask-server.exe src-tauri/binaries/flask-server-x86_64-pc-windows-msvc.exe -Force

      - name: Installer les dépendances Node
        run: npm ci

      - name: Compiler l'application Tauri
        run: npm run build

      - name: Attacher les installeurs au release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
