name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    name: unittest (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        # Le lien public des releases de llama-cpp-python renvoie 504 (l'API, elle, sert le fichier) :
        # on prend la roue via `gh`, et pip la trouve déjà installée.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^llama_cpp_python==//p' requirements.txt)
          gh release download "v$v" --repo abetlen/llama-cpp-python --dir wheels             --pattern "llama_cpp_python-$v-py3-none-win_amd64.whl"
          python -m pip install --no-deps wheels/*.whl
          python -m pip install -r requirements.txt

      - name: Lancer la suite
        run: python -m unittest discover -s tests -v
