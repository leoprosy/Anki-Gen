[package]
name = "anki-esh"
version = "1.2.0"
description = "Ankigen — Anki flashcard generator for .docx courses"
authors = ["Leo"]
license = "MIT"
repository = "https://github.com/leoprosy/Anki-Gen"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["blocking"], default-features = false }
