<!doctype html>
<html lang="fr">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Anki ESH Generator{% endblock %}</title>
    <meta name="description" content="Générateur de flashcards Anki à partir de cours .docx">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>

  <body>
    <header>
      <h1>
        <a href="{{ url_for('index') }}" style="display: flex; align-items: center; gap: 8px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          Anki ESH
        </a>
      </h1>
      {% block header_extra %}{% endblock %}
    </header>

    <!-- Bandeau de mise à jour (masqué par défaut) -->
    <div id="update-banner" class="update-banner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      <span id="update-message"></span>
      <button id="update-btn" class="update-apply" onclick="applyUpdate()">Mettre à jour</button>
      <button class="update-dismiss" onclick="document.getElementById('update-banner').style.display='none'">✕</button>
    </div>

    <main>
      {% block content %}{% endblock %}
    </main>

    <script>
    // ── Vérification silencieuse des mises à jour au démarrage ──
    async function checkUpdate() {
      try {
        const res = await fetch('/api/update/check');
        const data = await res.json();
        if (data.update_available) {
          document.getElementById('update-message').textContent =
            `Version ${data.remote_version} disponible`;
          document.getElementById('update-banner').style.display = 'flex';
        }
      } catch (_) {} // Silencieux si hors-ligne
    }

    async function applyUpdate() {
      const btn = document.getElementById('update-btn');
      btn.textContent = 'Mise à jour…';
      btn.disabled = true;
      try {
        const res = await fetch('/api/update/apply', { method: 'POST' });
        const data = await res.json();
        if (data.status === 'staged') {
          document.getElementById('update-message').textContent = data.message;
          btn.textContent = 'Quittez et relancez l\'application';
          btn.disabled = true;
        } else {
          document.getElementById('update-message').textContent = data.message;
          btn.textContent = 'Réessayer';
          btn.disabled = false;
        }
      } catch (e) {
        document.getElementById('update-message').textContent = 'Erreur réseau.';
        btn.textContent = 'Réessayer';
        btn.disabled = false;
      }
    }

    window.addEventListener('load', () => setTimeout(checkUpdate, 1500));
    </script>
  </body>

</html>
